<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760" role="img" aria-labelledby="title desc"><title id="title">STIMPOD NMS450X: temsili uygulama şeması</title><desc id="desc">Ulnar sinir uyarı elektrotları bileğe; kayıt/hareket sensörü adductor pollicis ölçümüne uygun yerleştirilir. Bloker öncesi başlangıç ölçümü ve üreticiye uygun kalibrasyon yapılır. Kesin elektrot veya kateter yerleşimi çizimi değildir.</desc><style>text{font-family:Arial,sans-serif;fill:#19374a}.body{font-size:18px}.small{font-size:15px}</style><rect width="1120" height="760" fill="#f3f7fa"/><rect x="25" y="25" width="1070" height="72" rx="12" fill="#173d51"/><text x="45" y="70" style="fill:white;font-size:27px">STIMPOD NMS450X</text><g fill="#dce7ed" stroke="#7f9cab" stroke-width="3"><circle cx="290" cy="175" r="47"/><path d="M265 222 L265 242 Q220 245 213 280 L174 390 Q170 411 188 418 Q201 421 209 401 L244 310 L244 410 L220 505 L270 505 L290 420 L310 505 L360 505 L336 410 L336 310 L374 403 Q380 422 399 417 Q414 410 405 390 L369 280 Q357 245 315 242 L315 222"/></g><circle cx="410" cy="405" r="12" fill="#dd762c"/><path d="M422 405 H520 V315 H650" fill="none" stroke="#dd762c" stroke-width="4" stroke-dasharray="9 6"/><rect x="650" y="240" width="380" height="165" rx="16" fill="white" stroke="#7897a6" stroke-width="3"/><text x="675" y="282" style="font-size:22px">Sistem / modül</text><text x="675" y="320" class="body">Bağlantı ve sinyal kontrolü</text><text x="675" y="354" class="body">Klinik bulgularla birlikte yorum</text><text x="540" y="460" class="body">Bilek (ulnar sinir) / başparmak</text><text x="45" y="535" style="font-size:20px;font-weight:bold">Hastada uygulama — genel yerleşim</text><text x="45" y="565" class="body">Ulnar sinir uyarı elektrotları bileğe; kayıt/hareket sensörü adductor pollicis ölçümüne uygun</text><text x="45" y="590" class="body">yerleştirilir. Nöromüsküler bloker uygulanmadan önce başlangıç ölçümü ve üretici talimatına uygun</text><text x="45" y="615" class="body">kalibrasyon yapılır.</text><rect x="25" y="702" width="1070" height="38" rx="8" fill="#ffe5ce"/><text x="42" y="727" class="small">TEMSİLİ ŞEMA • Cihaz fotoğrafı değildir. Kesin yerleşim için modele ve sensöre ait güncel IFU kullanılır.</text></svg>