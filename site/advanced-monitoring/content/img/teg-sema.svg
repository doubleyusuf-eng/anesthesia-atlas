<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760" role="img" aria-labelledby="title desc"><title id="title">TEG: temsili uygulama şeması</title><desc id="desc">Modelin onaylı kartuş/örnek protokolü izlenir; test türü ve cihaz sürümü kaydedilir. Kesin elektrot veya kateter yerleşimi çizimi değildir.</desc><style>text{font-family:Arial,sans-serif;fill:#19374a}.body{font-size:18px}.small{font-size:15px}</style><rect width="1120" height="760" fill="#f3f7fa"/><rect x="25" y="25" width="1070" height="72" rx="12" fill="#173d51"/><text x="45" y="70" style="fill:white;font-size:27px">TEG</text><g fill="#dce7ed" stroke="#7f9cab" stroke-width="3"><path d="M250 190 H330 V405 Q290 465 250 405 Z"/><path d="M250 310 H330 V405 Q290 465 250 405 Z" fill="#c35c60"/><rect x="240" y="170" width="100" height="25" rx="5"/></g><circle cx="290" cy="320" r="12" fill="#dd762c"/><path d="M302 320 H520 V315 H650" fill="none" stroke="#dd762c" stroke-width="4" stroke-dasharray="9 6"/><rect x="650" y="240" width="380" height="165" rx="16" fill="white" stroke="#7897a6" stroke-width="3"/><text x="675" y="282" style="font-size:22px">Sistem / modül</text><text x="675" y="320" class="body">Bağlantı ve sinyal kontrolü</text><text x="675" y="354" class="body">Klinik bulgularla birlikte yorum</text><text x="540" y="460" class="body">Etiketli kan örneği</text><text x="45" y="535" style="font-size:20px;font-weight:bold">Hastada uygulama — genel yerleşim</text><text x="45" y="565" class="body">Modelin onaylı kartuş/örnek protokolü izlenir; test türü ve cihaz sürümü kaydedilir.</text><rect x="25" y="702" width="1070" height="38" rx="8" fill="#ffe5ce"/><text x="42" y="727" class="small">TEMSİLİ ŞEMA • Cihaz fotoğrafı değildir. Kesin yerleşim için modele ve sensöre ait güncel IFU kullanılır.</text></svg>